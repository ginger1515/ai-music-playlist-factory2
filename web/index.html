<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Control Panel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .small {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    button {
      margin-top: 8px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }

    a {
      text-decoration: none;
    }

    .error {
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h2>🎵 AI Music Control Panel</h2>

<div id="app"></div>

<script>

// =====================
// CONFIG (MODIFICA QUI)
// =====================
const USER = "YOUR_GITHUB_USERNAME";
const REPO = "YOUR_REPO";
const DATE = "2026-06-21";

// =====================
// BASE URL RELEASES
// =====================
const BASE_URL =
  `https://raw.githubusercontent.com/${USER}/${REPO}/main/output/releases/${DATE}/`;

// =====================
// LOAD MANIFEST
// =====================
async function loadManifest() {

  const container = document.getElementById("app");

  try {
    const res = await fetch(BASE_URL + "release_manifest.json");
    const data = await res.json();

    data.tracks.forEach(track => {

      const folder = track.title.replaceAll(" ", "_");

      const promptURL = BASE_URL + folder + "/audio_suno_prompt.txt";
      const coverURL = BASE_URL + folder + "/cover.png";
      const metaURL = BASE_URL + folder + "/metadata.json";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="title">🎧 ${track.title}</div>
        <div class="small">Theme: ${track.theme}</div>
        <div class="small">Playlist: ${track.playlist}</div>

        <a href="${promptURL}" download>
          <button>⬇️ Download Suno Prompt</button>
        </a>

        <a href="${coverURL}" download>
          <button>🖼️ Download Cover</button>
        </a>

        <a href="${metaURL}" download>
          <button>📄 Download Metadata</button>
        </a>
      `;

      container.appendChild(card);
    });

  } catch (err) {
    container.innerHTML = `
      <div class="error">
        ❌ Nessuna release trovata.<br><br>
        Controlla che:
        <ul>
          <li>GitHub Actions sia eseguito</li>
          <li>release_manifest.json esista</li>
          <li>DATA sia corretta</li>
        </ul>
      </div>
    `;
  }
}

loadManifest();

</script>

</body>
</html>
