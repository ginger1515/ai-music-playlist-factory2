<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
    }
  </style>
</head>

<body>

<h2>🎵 AI Music Dashboard</h2>

<div id="app"></div>

<script>
const app = document.getElementById("app");

// demo dati (poi li colleghiamo al tuo GitHub)
const tracks = [
  {
    title: "Test Track 001",
    theme: "Focus Flow"
  },
  {
    title: "Test Track 002",
    theme: "Deep Work"
  }
];

tracks.forEach(track => {
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <div class="title">${track.title}</div>
    <div>Theme: ${track.theme}</div>

    <button>⬇️ Download Prompt</button>
    <button>🖼️ Download Cover</button>
  `;

  app.appendChild(div);
});
</script>

</body>
</html>
