<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Control Center</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .small {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    button {
      margin-top: 8px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }

    a {
      text-decoration: none;
    }

    .error {
      opacity: 0.8;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h2>🎵 AI Music Control Center</h2>

<div id="app"></div>

<script>

// =========================
// CONFIG
// =========================
const USER = "ginger1515";
const REPO = "ai-music-playlist-factory2";

// =========================
// GET LATEST RELEASE (ROBUST)
// =========================
async function getLatestReleaseDate() {
  try {
    const res = await fetch(
      `https://api.github.com/repos/${USER}/${REPO}/contents/output/releases`
    );

    const data = await res.json();

    if (!Array.isArray(data)) return null;

    const folders = data
      .filter(item => item && item.type === "dir" && item.name)
      .map(item => item.name)
      .filter(name => /^\d{4}-\d{2}-\d{2}$/.test(name))
      .sort();

    return folders.length ? folders[folders.length - 1] : null;

  } catch (e) {
    console.error(e);
    return null;
  }
}

// =========================
// LOAD APP
// =========================
async function loadApp() {

  const container = document.getElementById("app");

  const DATE = await getLatestReleaseDate();

  if (!DATE) {
    container.innerHTML = `
      <div class="error">
        ❌ Nessuna release trovata.<br><br>
        Controlla GitHub Actions e output/releases.
      </div>
    `;
    return;
  }

  const BASE_URL =
    `https://raw.githubusercontent.com/${USER}/${REPO}/main/output/releases/${DATE}/`;

  let uploaded = JSON.parse(localStorage.getItem("uploaded_tracks") || "{}");

  try {
    const res = await fetch(BASE_URL + "release_manifest.json");

    if (!res.ok) {
      throw new Error("Manifest non trovato");
    }

    const data = await res.json();

    data.tracks.forEach(track => {

      const folder = track.title.replaceAll(" ", "_");

      const promptURL = BASE_URL + folder + "/audio_suno_prompt.txt";
      const coverURL = BASE_URL + folder + "/cover.png";
      const metaURL = BASE_URL + folder + "/metadata.json";

      const isUploaded = uploaded[track.title];

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="title">🎧 ${track.title}</div>
        <div class="small">Theme: ${track.theme}</div>
        <div class="small">Playlist: ${track.playlist}</div>
        <div class="small">Status: ${isUploaded ? "✅ Uploaded Spotify" : "⏳ Pending"}</div>

        <a href="${promptURL}" download>
          <button>⬇️ Download Suno Prompt</button>
        </a>

        <a href="${coverURL}" download>
          <button>🖼️ Download Cover</button>
        </a>

        <a href="${metaURL}" download>
          <button>📄 Download Metadata</button>
        </a>

        <button onclick="markUploaded('${track.title}')">
          ✔ Mark as Uploaded
        </button>
      `;

      container.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    container.innerHTML = `
      <div class="error">
        ❌ Errore caricamento release.<br><br>
        Possibili cause:<br>
        - release_manifest.json mancante<br>
        - GitHub Actions non completata<br>
        - path output errato
      </div>
    `;
  }
}

// =========================
// LOCAL STORAGE TRACKING
// =========================
function markUploaded(title) {

  let uploaded = JSON.parse(localStorage.getItem("uploaded_tracks") || "{}");

  uploaded[title] = true;

  localStorage.setItem("uploaded_tracks", JSON.stringify(uploaded));

  alert("✔ Segnato come caricato su Spotify");
}

// RUN
loadApp();

</script>

</body>
</html>
